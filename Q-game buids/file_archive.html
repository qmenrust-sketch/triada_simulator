<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив версий — TRIADA SIMULATOR</title>
    <style>
        /* === ТЁМНО-СЕРЫЙ ФОН === */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: 'Courier New', 'Lucida Console', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
        }

        /* === ЗАГОЛОВОК СТРАНИЦЫ === */
        .page-title {
            font-size: 2.5rem;
            color: #ffffff;
            letter-spacing: 4px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .page-title .highlight {
            color: #ff0000;
        }

        /* === КОНТЕЙНЕР ДЛЯ ЯЧЕЕК === */
        .archive-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* === ОДНА ЯЧЕЙКА === */
        .version-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px 28px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .version-card:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.03);
        }

        /* === ЛЕВАЯ ЧАСТЬ: НАЗВАНИЕ ВЕРСИИ === */
        .version-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .version-tag {
            font-size: 0.7rem;
            color: #888888;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            letter-spacing: 0.5px;
        }

        .version-tag.new {
            color: #ffd93d;
            border-color: rgba(255, 217, 61, 0.3);
            background: rgba(255, 217, 61, 0.08);
        }

        .version-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .version-name .highlight {
            color: #ff0000;
        }

        /* === ПРАВАЯ ЧАСТЬ: ДАТА И КНОПКА === */
        .version-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .version-date {
            font-size: 0.85rem;
            color: #888888;
            letter-spacing: 0.5px;
        }

        .download-btn-archive {
            font-family: 'Courier New', 'Lucida Console', monospace;
            font-size: 0.95rem;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 24px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .download-btn-archive:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.05);
        }

        /* === КНОПКА НАЗАД === */
        .back-link {
            margin-top: 50px;
            font-family: 'Courier New', 'Lucida Console', monospace;
            font-size: 1rem;
            color: #888888;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
            padding-bottom: 4px;
        }

        .back-link:hover {
            color: #ffffff;
            border-bottom-color: rgba(255, 255, 255, 0.4);
        }

        /* === АДАПТАЦИЯ === */
        @media (max-width: 700px) {
            .version-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
                padding: 18px 20px;
            }

            .version-actions {
                width: 100%;
                justify-content: space-between;
            }

            .page-title {
                font-size: 1.8rem;
            }

            .version-name {
                font-size: 1.1rem;
            }

            .download-btn-archive {
                font-size: 0.85rem;
                padding: 6px 18px;
            }
        }

        @media (max-width: 450px) {
            .version-actions {
                flex-wrap: wrap;
                gap: 10px;
            }

            .version-date {
                font-size: 0.75rem;
            }

            .version-tag {
                font-size: 0.6rem;
                padding: 2px 10px;
            }

            .page-title {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- === ЗАГОЛОВОК === -->
    <h1 class="page-title">Архив <span class="highlight">версий</span></h1>

    <!-- === КОНТЕЙНЕР С ЯЧЕЙКАМИ === -->
    <div class="archive-container">

        <!-- === НОВЫЙ БЛОК: TRIADA SIMULATOR 1.0.0.0 === -->
        <div class="version-card">
            <div class="version-info">
                <span class="version-tag new">Новая</span>
                <span class="version-name">TRIADA SIMULATOR — 1.0.0.0</span>
            </div>
            <div class="version-actions">
                <span class="version-date">03.10.2026</span>
                <a href="https://github.com/qmenrust-sketch/storyOne_assult/releases/download/triada_sim/triadasimulator.exe" target="_blank" class="download-btn-archive">Скачать</a>
            </div>
        </div>

        <!-- === СТАРЫЙ БЛОК: 0.0.0.3 close beta === -->
        <div class="version-card">
            <div class="version-info">
                <span class="version-tag">Стабильная</span>
                <span class="version-name">0.0.0.3 <span class="highlight">close</span> beta</span>
            </div>
            <div class="version-actions">
                <span class="version-date">16.07.2026</span>
                <a href="https://github.com/qmenrust-sketch/storyOne_assult/releases/download/story_one_assault/story.one.assault.0.0.0.3" target="_blank" class="download-btn-archive">Скачать</a>
            </div>
        </div>

    </div>

    <!-- === ССЫЛКА НАЗАД === -->
    <a href="index.html" class="back-link">← На главную</a>

</body>
</html>
