<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив версий — TRIADA SIMULATOR</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            background: #1a1a1a;
            font-family: 'Courier New', 'Lucida Console', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            box-sizing: border-box;
        }

        .page-title {
            font-size: 2.5rem;
            color: #ffffff;
            letter-spacing: 4px;
            margin-bottom: 40px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .page-title .highlight {
            color: #ff0000;
        }

        .archive-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .version-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 20px 28px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .version-card:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.03);
        }

        .version-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .version-top {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .version-tag {
            font-size: 0.7rem;
            color: #888888;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            letter-spacing: 0.5px;
        }

        /* === АКТУАЛЬНАЯ — ЗЕЛЁНАЯ === */
        .version-tag.actual {
            color: #44ff44;
            border-color: rgba(68, 255, 68, 0.4);
            background: rgba(68, 255, 68, 0.08);
        }

        /* === ИСТОРИЯ ОДНОГО ШТУРМА — КРАСНАЯ === */
        .version-tag.ios {
            color: #ff4444;
            border-color: rgba(255, 68, 68, 0.4);
            background: rgba(255, 68, 68, 0.08);
        }

        .version-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .version-name .highlight {
            color: #ff0000;
        }

        /* === СЧЁТЧИК — БЕЛЫЙ === */
        .download-counter {
            font-size: 0.8rem;
            color: #ffffff;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding-left: 2px;
        }

        .download-counter .count {
            color: #ffffff;
            font-weight: bold;
        }

        .download-counter .icon {
            font-size: 0.9rem;
        }

        .version-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .version-date {
            font-size: 0.85rem;
            color: #888888;
            letter-spacing: 0.5px;
        }

        .download-btn-archive {
            font-family: 'Courier New', 'Lucida Console', monospace;
            font-size: 0.95rem;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 8px 24px;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .download-btn-archive:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.05);
        }

        .loading-text {
            color: #888888;
            text-align: center;
            font-size: 1rem;
            padding: 20px;
        }

        .back-link {
            margin-top: 50px;
            font-family: 'Courier New', 'Lucida Console', monospace;
            font-size: 1rem;
            color: #888888;
            text-decoration: none;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border-bottom: 1px solid transparent;
            padding-bottom: 4px;
        }

        .back-link:hover {
            color: #ffffff;
            border-bottom-color: rgba(255, 255, 255, 0.4);
        }

        @media (max-width: 700px) {
            .version-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
                padding: 18px 20px;
            }
            .version-actions { width: 100%; justify-content: space-between; }
            .page-title { font-size: 1.8rem; }
            .version-name { font-size: 1.1rem; }
            .download-btn-archive { font-size: 0.85rem; padding: 6px 18px; }
        }

        @media (max-width: 450px) {
            .version-actions { flex-wrap: wrap; gap: 10px; }
            .version-date { font-size: 0.75rem; }
            .version-tag { font-size: 0.6rem; padding: 2px 10px; }
            .page-title { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <h1 class="page-title">Архив <span class="highlight">версий</span></h1>

    <div class="archive-container" id="archiveContainer">

        <!-- CLOSE BETA — История одного штурма (КРАСНАЯ плашка) -->
        <div class="version-card">
            <div class="version-info">
                <div class="version-top">
                    <span class="version-tag ios">История одного штурма</span>
                    <span class="version-name">0.0.0.3 <span class="highlight">close</span> beta</span>
                </div>
                <div class="download-counter">
                    <span class="icon">⬇</span>
                    <span class="count" id="closeBetaCount">—</span>
                    <span>скачиваний</span>
                </div>
            </div>
            <div class="version-actions">
                <span class="version-date">16.07.2026</span>
                <a href="https://github.com/qmenrust-sketch/storyOne_assult/releases/download/story_one_assault/story.one.assault.0.0.0.3" 
                   target="_blank" class="download-btn-archive">Скачать</a>
            </div>
        </div>

        <div id="autoReleases" style="display: contents;">
            <p class="loading-text">Загрузка версий...</p>
        </div>

    </div>

    <a href="index.html" class="back-link">← На главную</a>

    <script>
        const REPO = 'qmenrust-sketch/triada_simulator';
        const OLD_REPO = 'qmenrust-sketch/storyOne_assult';
        const autoContainer = document.getElementById('autoReleases');

        // === Счётчик для close beta ===
        async function loadCloseBetaCount() {
            try {
                const response = await fetch(`https://api.github.com/repos/${OLD_REPO}/releases`);
                const releases = await response.json();

                const closeBeta = releases.find(r =>
                    r.tag_name.includes('story_one') || r.name?.toLowerCase().includes('close')
                );
                if (!closeBeta) return;

                const asset = closeBeta.assets[0];
                if (asset) {
                    document.getElementById('closeBetaCount').textContent = asset.download_count;
                }
            } catch (e) {
                console.error('Не удалось загрузить счётчик close beta:', e);
            }
        }

        // === Основная загрузка релизов ===
        async function loadAllReleases() {
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO}/releases`);
                const releases = await response.json();

                autoContainer.innerHTML = '';

                if (!releases.length) {
                    autoContainer.innerHTML = '<p class="loading-text">Пока нет версий TRIADA SIMULATOR</p>';
                    return;
                }

                releases.forEach((release, index) => {
                    const asset = release.assets.find(a =>
                        a.name.endsWith('.exe') || a.name.endsWith('.zip')
                    );
                    if (!asset) return;

                    const date = new Date(release.published_at).toLocaleDateString('ru-RU', {
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric'
                    });

                    // === ПЕРВЫЙ — АКТУАЛЬНАЯ (ЗЕЛЁНАЯ), ОСТАЛЬНЫЕ — БЕЗ ПЛАШКИ ===
                    const isFirst = index === 0;
                    const tagHtml = isFirst
                        ? '<span class="version-tag actual">Актуальная</span>'
                        : '';

                    const card = document.createElement('div');
                    card.className = 'version-card';
                    card.innerHTML = `
                        <div class="version-info">
                            <div class="version-top">
                                ${tagHtml}
                                <span class="version-name">${release.name || release.tag_name}</span>
                            </div>
                            <div class="download-counter">
                                <span class="icon">⬇</span>
                                <span class="count">${asset.download_count}</span>
                                <span>скачиваний</span>
                            </div>
                        </div>
                        <div class="version-actions">
                            <span class="version-date">${date}</span>
                            <a href="${asset.browser_download_url}" target="_blank" class="download-btn-archive">Скачать</a>
                        </div>
                    `;
                    autoContainer.appendChild(card);
                });

            } catch (e) {
                console.error('Ошибка загрузки релизов:', e);
                autoContainer.innerHTML = '<p class="loading-text" style="color: #ff4444;">Не удалось загрузить версии</p>';
            }
        }

        loadCloseBetaCount();
        loadAllReleases();
    </script>

</body>
</html>
